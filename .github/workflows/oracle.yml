name: oracle

# Refreshes oracle fixtures from both PHP and Node ICU and verifies the two
# agree byte-for-byte. This is the "fixture refresh is a deliberate reviewed
# action" gate — a PR that touches the generators must show a clean diff here
# before it can merge.

on:
  push:
    branches: [main]
    paths:
      - 'tools/generate-*.php'
      - 'tools/generate-*.mjs'
      - 'tools/verify-oracles-agree.php'
      - '.github/workflows/oracle.yml'
  pull_request:
    paths:
      - 'tools/generate-*.php'
      - 'tools/generate-*.mjs'
      - 'tools/verify-oracles-agree.php'
      - 'tests/fixtures/**'
      - '.github/workflows/oracle.yml'
  workflow_dispatch:

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP with ext-intl
        uses: shivammathur/setup-php@v2
        with:
          # Pin the ICU the committed fixtures and Table.php were built with
          # (see their headers / Table::ICU_VERSION). Different ICU releases
          # place some far-future Jalali leap days differently, which would
          # show up as data drift. Bump together with a fixture refresh.
          php-version: '8.5'
          extensions: intl-78.2, mbstring, dom, xml, zlib
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          # relative-time.jsonl.gz is committed and Node-generated; pin the
          # major it was built with so its ICU strings don't drift.
          node-version: '24'

      - name: Record ICU versions
        run: |
          php -r 'echo "PHP  ICU: " . INTL_ICU_VERSION . PHP_EOL;'
          node -e 'console.log("Node ICU: " + process.versions.icu)'

      - name: Install composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Regenerate the bundled Umm al-Qura table from the runner's ICU
        run: |
          # Must run BEFORE the fixture generators: the PHP fixture generator
          # reads Table::MIN_YEAR/MAX_YEAR to filter the UAQ fixture, so the
          # table must reflect the same ICU the fixtures are generated from.
          # `--skip-van-gent` avoids the network cross-check; CI runners may
          # not have outbound HTTP, and the cross-check is a human sanity step.
          php tools/generate-uaq-table.php --skip-van-gent

      - name: Regenerate PHP-side fixtures
        run: |
          php tools/generate-fixtures-php.php
          php tools/generate-format-tokens.php

      - name: Regenerate Node-side fixtures
        run: |
          node tools/generate-fixtures-node.mjs
          node tools/generate-relative-time-node.mjs

      - name: Verify PHP and Node ICU fixtures agree
        run: php tools/verify-oracles-agree.php

      - name: Run the full test suite against the freshly regenerated fixtures
        run: vendor/bin/phpunit

      - name: Check for unexpected fixture or UAQ-table drift
        # Compares data rows only: headers record the runner's ICU version,
        # which legitimately differs from the maintainer's.
        run: php tools/check-fixture-drift.php
