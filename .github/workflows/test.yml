name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  phpunit:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # Deliberately NO ext-intl: the committed fixtures let us run every
          # conformance test on a pure PHP install, proving the zero-runtime-dep
          # promise holds.
          extensions: mbstring, dom, xml, zlib, :intl
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Verify no ext-intl is loaded at runtime
        run: |
          if php -m | grep -qi intl; then
            echo "ext-intl is unexpectedly loaded — this job exists to prove Daynum works without it."
            exit 1
          fi

      - name: Run unit tests
        run: vendor/bin/phpunit --testsuite=unit

      - name: Run edge case tests
        run: vendor/bin/phpunit --testsuite=edgecase

      - name: Run property tests
        run: vendor/bin/phpunit --testsuite=property

      - name: Run ICU conformance tests (pre-committed fixtures, no ext-intl)
        run: vendor/bin/phpunit --testsuite=conformance

      - name: Run PHPStan static analysis
        # Through the composer script so CI uses the same memory limit as a
        # local run (bare `phpstan analyse` exhausts PHP's default 128M).
        run: composer phpstan -- --no-progress

  style:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # The lowest supported PHP, so the fixer never suggests newer syntax.
          php-version: '8.1'
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Check code style (PER-CS 2.0)
        run: composer cs

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, zlib, :intl
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run tests with line coverage
        run: vendor/bin/phpunit --coverage-text --only-summary-for-coverage-text
