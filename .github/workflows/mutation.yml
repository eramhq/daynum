name: mutation

# Mutation testing with Infection: small deliberate bugs ("mutants") are
# injected into src/ and the test suites must catch them. The conformance
# and property suites run on a deterministic sample (env below) so the job
# stays fast. It fails if the covered-code score (MSI) drops below the floor.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  infection:
    runs-on: ubuntu-latest
    env:
      # Every 50th ICU fixture row and 5% of the property iterations.
      DAYNUM_FIXTURE_STRIDE: 50
      DAYNUM_PROPERTY_SCALE: 0.05
    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, zlib, :intl
          coverage: pcov
          tools: composer:v2, infection

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run Infection
        # Covered MSI measured 99.7% on five runs with the sampled suites;
        # the floor leaves ~60 mutants of room for timing-dependent
        # timeouts on shared runners.
        run: infection --threads=max --no-progress --show-mutations=0 --min-covered-msi=97

      - name: Upload Infection log
        # Escaped mutants with file paths; GitHub shows only 10 annotations.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: infection-log
          path: infection.log
          if-no-files-found: ignore
