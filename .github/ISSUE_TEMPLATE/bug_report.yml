name: Bug report
description: Something gives a wrong date, wrong output, or an unexpected error.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! A short, runnable snippet is the fastest way to a fix.
        Security problem? Please use the private report link instead (see SECURITY.md).
  - type: textarea
    id: snippet
    attributes:
      label: Code to reproduce
      description: The smallest PHP snippet that shows the problem.
      render: php
      placeholder: |
        use Eram\Daynum\CivilDateTime;

        echo CivilDateTime::fromGregorian(2026, 4, 8)->jalali()->format('Y/m/d');
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual
      description: What you expected, what you got, and — for wrong dates — where the expected value comes from (e.g. time.ir, an official calendar, ICU).
      placeholder: |
        Expected: 1405/01/19
        Actual:   1405/01/18
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Daynum version
      placeholder: 1.0.0-beta.2
    validations:
      required: true
  - type: input
    id: php
    attributes:
      label: PHP version
      placeholder: "8.3.12"
    validations:
      required: true
